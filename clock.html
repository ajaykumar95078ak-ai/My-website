<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at center, #10243b, #05080d 70%);
            font-family: Arial, sans-serif;
            color: white;
        }

        .clock-box {
            width: 650px;
            padding: 45px 50px;
            text-align: center;
            border: 2px solid #00aaff;
            border-radius: 30px;
            background: rgba(5, 15, 25, 0.75);
            box-shadow:
                0 0 20px #008cff,
                0 0 50px rgba(0, 140, 255, 0.35);
        }

        .clock {
            font-size: 80px;
            font-weight: bold;
            letter-spacing: 5px;
            color: #00bfff;
            text-shadow:
                0 0 10px #00bfff,
                0 0 25px #008cff;
        }

        .date {
            margin-top: 20px;
            font-size: 22px;
            color: #e8f4ff;
            letter-spacing: 1px;
        }

        .line {
            width: 70%;
            height: 2px;
            margin: 25px auto 0;
            background: #00aaff;
            box-shadow: 0 0 10px #00aaff;
        }

        @media (max-width: 700px) {
            .clock-box {
                width: 90%;
                padding: 35px 20px;
            }

            .clock {
                font-size: 45px;
                letter-spacing: 2px;
            }

            .date {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

    <div class="clock-box">

        <div class="clock" id="clock">00:00:00</div>

        <div class="date" id="date">
            Loading...
        </div>

        <div class="line"></div>

    </div>

    <script>
        function updateClock() {
            const now = new Date();

            let hours = now.getHours();
            let minutes = now.getMinutes();
            let seconds = now.getSeconds();

            hours = String(hours).padStart(2, "0");
            minutes = String(minutes).padStart(2, "0");
            seconds = String(seconds).padStart(2, "0");

            document.getElementById("clock").textContent =
                `${hours}:${minutes}:${seconds}`;

            const options = {
                day: "numeric",
                month: "long",
                year: "numeric",
                weekday: "long"
            };

            document.getElementById("date").textContent =
                now.toLocaleDateString("en-IN", options);
        }

        updateClock();
        setInterval(updateClock, 1000);
    </script>

</body>
</html>
